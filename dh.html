<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHC尘辉 · 公会宣传动画</title>
    <!-- 可爱风格 + 轻量动画 (CSS) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* 可爱风格背景：粉彩渐变 + 小元素点缀 */
            background: 
                radial-gradient(circle at 10% 30%, rgba(255, 225, 235, 0.6) 0%, transparent 35%),
                radial-gradient(circle at 90% 70%, rgba(215, 235, 255, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(255, 240, 200, 0.4) 0%, transparent 30%),
                linear-gradient(145deg, #fdeff2 0%, #f8e8ee 30%, #f0e6f0 70%, #e8eff8 100%);
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            padding: 24px 16px 40px;
            color: #1a2639;
            background-attachment: fixed;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 可爱小点缀 (云朵/星星/小花) */
        body::before {
            content: "🌸 ✨ 🐾 🌱 🍀 ☁️ 🌟";
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2.8rem;
            opacity: 0.15;
            white-space: pre-wrap;
            line-height: 4.2rem;
            pointer-events: none;
            transform: rotate(-6deg);
            z-index: 0;
            max-width: 120px;
            filter: drop-shadow(0 4px 6px rgba(255, 150, 180, 0.1));
        }

        body::after {
            content: "🦊 🐼 🐨 🐰 🐻‍❄️ 🌈";
            position: fixed;
            bottom: 30px;
            right: 20px;
            font-size: 2.6rem;
            opacity: 0.12;
            pointer-events: none;
            transform: rotate(6deg);
            z-index: 0;
            line-height: 3.8rem;
            text-align: right;
            filter: drop-shadow(0 4px 8px rgba(200, 150, 200, 0.1));
        }

        /* 主卡片 毛玻璃+可爱圆润 + 动画入场 */
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: rgba(255, 248, 250, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 24px 60px -12px rgba(180, 120, 140, 0.3), 
                        0 0 0 2px rgba(255, 220, 230, 0.5) inset;
            padding: 36px 32px 44px;
            transition: 0.2s;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: floatIn 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== 公会品牌头 ===== */
        .brand-header {
            text-align: center;
            margin-bottom: 16px;
            animation: glowPulse 3s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 6px rgba(200, 130, 180, 0.2)); }
            100% { filter: drop-shadow(0 0 20px rgba(200, 130, 180, 0.4)); }
        }
        .brand-header .logo-text {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #b35d7a, #8f5a8a, #5f7a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-shadow: 0 2px 20px rgba(200, 130, 160, 0.2);
        }
        .brand-header .sub-brand {
            font-size: 1.3rem;
            color: #5b4a5e;
            background: rgba(235, 210, 225, 0.3);
            padding: 6px 28px;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 装饰分隔 + 动画 */
        .divider-cute {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 18px 0 22px;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .divider-cute .line {
            height: 2px;
            flex: 1;
            background: linear-gradient(90deg, transparent, rgba(200, 150, 180, 0.5), transparent);
        }
        .divider-cute .icon {
            font-size: 2rem;
            opacity: 0.7;
            animation: spinSlow 12s linear infinite;
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== 动画亮点卡片 (悬停+入场) ===== */
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 16px 0 28px;
        }
        .feature-card {
            background: rgba(255, 240, 245, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 20px 18px 18px;
            border: 1px solid rgba(255, 220, 230, 0.5);
            box-shadow: 0 4px 14px rgba(200, 150, 170, 0.06);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            text-align: center;
            animation: cardPop 0.6s ease backwards;
        }
        .feature-card:nth-child(1) { animation-delay: 0.1s; }
        .feature-card:nth-child(2) { animation-delay: 0.2s; }
        .feature-card:nth-child(3) { animation-delay: 0.3s; }
        .feature-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.92) translateY(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .feature-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: rgba(255, 235, 245, 0.7);
            box-shadow: 0 12px 28px rgba(200, 150, 170, 0.15);
        }
        .feature-card .emoji-big {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 6px;
            animation: bounceEmoji 2s ease-in-out infinite;
        }
        .feature-card:nth-child(2) .emoji-big { animation-delay: 0.3s; }
        .feature-card:nth-child(3) .emoji-big { animation-delay: 0.6s; }
        .feature-card:nth-child(4) .emoji-big { animation-delay: 0.9s; }

        @keyframes bounceEmoji {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .feature-card h3 {
            font-size: 1.15rem;
            color: #4f3a5a;
            font-weight: 600;
        }
        .feature-card p {
            font-size: 0.92rem;
            color: #5b4a5e;
            margin-top: 4px;
            opacity: 0.85;
        }

        @media (max-width: 540px) {
            .feature-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .brand-header .logo-text {
                font-size: 2.4rem;
            }
            .container {
                padding: 24px 18px 32px;
            }
        }

        /* ===== 信息速览 (浮动标签) ===== */
        .info-snapshot {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 24px;
            background: rgba(235, 210, 225, 0.15);
            border-radius: 40px;
            padding: 12px 22px;
            margin: 20px 0 12px;
            border: 1px solid rgba(255, 220, 230, 0.3);
            animation: fadeSlide 1s ease 0.5s both;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .info-snapshot span {
            font-size: 0.95rem;
            color: #4f3a5a;
        }
        .info-snapshot strong {
            color: #5b3e5a;
            font-weight: 600;
        }

        /* ===== 召唤按钮 + 动画 ===== */
        .cta-area {
            text-align: center;
            margin: 30px 0 18px;
        }
        .btn-recruit {
            display: inline-block;
            background: linear-gradient(145deg, #b87a94, #a06a8a);
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 52px;
            border-radius: 80px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(180, 110, 140, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            animation: btnPulse 2.4s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(180, 110, 140, 0.3); }
            50% { box-shadow: 0 12px 40px rgba(180, 110, 140, 0.5); }
        }
        .btn-recruit:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #c68aa4, #b07494);
            box-shadow: 0 14px 40px rgba(180, 110, 140, 0.5);
        }
        .btn-recruit .arrow {
            display: inline-block;
            margin-left: 10px;
            transition: 0.25s;
        }
        .btn-recruit:hover .arrow {
            transform: translateX(8px);
        }

        .recruit-note {
            text-align: center;
            font-size: 0.9rem;
            color: #78627a;
            margin-top: 12px;
            opacity: 0.7;
            background: rgba(235, 215, 225, 0.2);
            padding: 6px 18px;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            animation: fadeSlide 1s ease 0.8s both;
        }

        /* ===== 公会精神标语 ===== */
        .motto {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 2px dashed rgba(200, 160, 180, 0.4);
            color: #4f3a5a;
            animation: fadeSlide 1s ease 0.6s both;
        }
        .motto span {
            background: rgba(240, 215, 230, 0.3);
            padding: 2px 24px;
            border-radius: 60px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #8a7a8a;
            margin-top: 16px;
            opacity: 0.6;
            animation: fadeSlide 1s ease 0.9s both;
        }

        /* ===== 额外浮动装饰 (纯CSS动画) ===== */
        .floating-star {
            position: fixed;
            font-size: 1.8rem;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
            animation: floatAround 14s ease-in-out infinite alternate;
        }
        .floating-star:nth-of-type(1) { top: 12%; left: 6%; animation-duration: 16s; }
        .floating-star:nth-of-type(2) { bottom: 18%; right: 5%; animation-duration: 18s; animation-delay: 2s; }
        .floating-star:nth-of-type(3) { top: 40%; right: 3%; font-size: 2.2rem; animation-duration: 20s; animation-delay: 4s; }

        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(20px, -30px) rotate(12deg) scale(1.1); }
            66% { transform: translate(-10px, 20px) rotate(-8deg) scale(0.9); }
            100% { transform: translate(15px, 10px) rotate(5deg) scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- 浮动小装饰 (额外) -->
    <div class="floating-star">✨</div>
    <div class="floating-star">🌟</div>
    <div class="floating-star">🌸</div>

    <div class="container">

        <!-- ===== 品牌头 ===== -->
        <div class="brand-header">
            <div class="logo-text">✦ AHC尘辉 ✦</div>
            <div class="sub-brand">🏹 同心协作 · 共建生存世界</div>
        </div>

        <!-- 装饰分隔 -->
        <div class="divider-cute">
            <span class="line"></span>
            <span class="icon">🌙</span>
            <span class="line"></span>
        </div>

        <!-- ===== 亮点卡片 ===== -->
        <div class="feature-grid">
            <div class="feature-card">
                <span class="emoji-big">🏠</span>
                <h3>温馨大家庭</h3>
                <p>活跃友爱，管理在线，拒绝熊孩子</p>
            </div>
            <div class="feature-card">
                <span class="emoji-big">⚔️</span>
                <h3>丰富设施</h3>
                <p>小黑塔 · 烈焰人农场 · 猪人塔 · 掠夺塔</p>
            </div>
            <div class="feature-card">
                <span class="emoji-big">🎯</span>
                <h3>招新奖励</h3>
                <p>成功引荐一名新成员，奖励 200 金币</p>
            </div>
            <div class="feature-card">
                <span class="emoji-big">🛡️</span>
                <h3>公平守则</h3>
                <p>明确条例，禁止作弊，和谐共建</p>
            </div>
        </div>

        <!-- ===== 信息速览 ===== -->
        <div class="info-snapshot">
            <span>👑 会长 <strong>CamilleXili</strong></span>
            <span>⭐ 副会 <strong>HBJKG</strong></span>
            <span>📡 服务器 <strong>mcgame.me</strong></span>
            <span>📌 版本 <strong>JAVA 26.1.2 Fabric</strong></span>
        </div>

        <!-- ===== 召唤按钮 ===== -->
        <div class="cta-area">
            <a href="https://reallytvt.github.io/index.html" target="_blank" class="btn-recruit">
                🧑‍🤝‍🧑 立即加入 <span class="arrow">→</span>
            </a>
        </div>

        <!-- 小字说明 -->
        <div style="text-align: center;">
            <span class="recruit-note">📋 点击按钮查看完整公会信息 & 入会指引</span>
        </div>

        <!-- ===== 公会精神 ===== -->
        <div class="motto">
            <span>✨ 尘辉之下，共筑冒险之梦 ✨</span>
        </div>

        <!-- 底部 -->
        <div class="footer-note">
            AHC尘辉 · 宣传动画页 · 期待你的加入
        </div>

    </div>
    <!-- 容器结束 -->
</body>
</html>
